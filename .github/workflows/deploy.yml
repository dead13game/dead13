# 自动部署 Godot Web 版到 GitHub Pages
# 在 CI 上下载 Godot 4.7.1 并执行 Web 导出，产物上传到 Pages
# 前置条件：仓库 Settings → Pages → Source 选择 "GitHub Actions"
name: Deploy to Pages

on:
  push:
    branches: [main]

env:
  GODOT_VERSION: "4.7.1"
  GODOT_RELEASE: "4.7.1-stable"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot editor
        run: |
          curl -Lo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -o godot.zip
          chmod +x Godot_v${GODOT_RELEASE}_linux.x86_64
          mv Godot_v${GODOT_RELEASE}_linux.x86_64 godot-bin

      - name: Install Web export templates
        run: |
          curl -Lo templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -o templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Export Web build
        working-directory: godot
        run: |
          mkdir -p build/web
          ../godot-bin --headless --path . --export-release "Web"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./godot/build/web"

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
