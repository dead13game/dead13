# 亡命十三街 权限规则
# deny 规则为硬阻断：任何模式（含 yolo）都不可绕过（官方注释: "hard-blocked in every mode"）
[permissions]
deny = [
  "Bash(git push*)",   # GitHub 上传：git push（禁自己 push，改完提醒用户手动 push）
  "Bash(gh *)",        # GitHub CLI：PR / release / repo 上传等，会导致 GitHub 账号封禁
  "Bash(git clone*)",  # 批量拉代码：克隆远程仓库
  "Bash(git pull*)",   # 批量拉代码：拉取远程更新
]
allow = ["Bash=cat public/sfx/README.md; echo \"===playBgm / mute in project===\"; grep -rn \"playBgm\\|stopBgm\\|setMuted\\|SoundManager\\.\" src/ --include=\"*.vue\" --include=\"*.js\" | grep -v \"SoundManager.js\" | head; echo \"===ffmpeg?===\"; which ffmpeg ffplay 2>&1; echo \"===ffmpeg ver===\"; ffmpeg -version 2>&1 | head -1", "Bash=cat >> docs/solo-roguelike-design.md << 'EOF'\n\n---\n\n## 12. 数值总表（设计层草案，试玩后调）\n\n### 12.1 玩家基准\n\n| 项 | 值 |\n| --- | --- |\n| 初始属性 | 力量 2 / 法力 2 / 防御 2 |\n| 初始最大 HP | 20 + 防御 × 2 = 24 |\n| 升级 | 每级 +2 属性点，自由分配 |\n| 费用换算 | `max(1, ⌊2 张扑克点数总和 ÷ 5⌋)`，范围 1-5 |\n| 累计池上限 | 3 点 |\n| 手牌上限 | 6 张 |\n| 每回合出牌上限 | 3 张 |\n| 平局规则 | 30 回合，HP 比例高者胜，相同则玩家败 |\n\n### 12.2 技能卡总表\n\n**物理（力量修正）**\n\n| 卡名 | 费用 | 效果 |\n| --- | --- | --- |\n| 猛击 | 1 | 3 + 力量 伤害 |\n| 重击 | 2 | 6 + 力量 伤害 |\n| 连击 | 3 | 3 + 力量 伤害 × 2 段 |\n| 破甲 | 2 | 4 + 力量 伤害，目标下回合防御 -2 |\n\n**法术（法力修正）**\n\n| 卡名 | 费用 | 效果 |\n| --- | --- | --- |\n| 奥术冲击 | 1 | 2 + 法力 伤害 |\n| 冰锥 | 2 | 3 + 法力 伤害，目标下回合费用 -1 |\n| 治愈 | 2 | 4 + 法力 回血 |\n| 火球 | 3 | 5 + 法力 伤害 |\n\n**防御（防御修正）**\n\n| 卡名 | 费用 | 效果 |\n| --- | --- | --- |\n| 格挡 | 1 | 4 + 防御 减伤（持续到玩家下回合结束） |\n| 回气 | 1 | 2 + 防御 减伤，回复 1 费用 |\n| 铁壁 | 2 | 7 + 防御 减伤 |\n\n**功能**\n\n| 卡名 | 费用 | 效果 |\n| --- | --- | --- |\n| 狂怒 | 1 | 斗志 +2（玛薇卡联动） |\n| 专注 | 1 | 下回合抽 3 张扑克（多 1 费） |\n\n**玛薇卡初始卡组（4 张）**：猛击 ×2、重击 ×1、格挡 ×1\n\n### 12.3 敌人数据\n\n| 敌人 | HP | 攻击卡 | 行为要点 |\n| --- | --- | --- | --- |\n| 普通 | 20 | 2-3 张 3-4 伤 | 够费出最高攻击；HP<30% 优先防御 |\n| 精英 | 30 | 3-4 张 4-5 伤 | 开局铺 1 防御；HP<50% 攻防轮换 |\n| 首领 | 40 | 4 张 5-6 伤 | 每 3 回合狂暴 +2；HP<30% 二阶段攻击频率↑ |\n\n敌人与玩家同费用规则（抽 2 张扑克 ÷5）。\n\n### 12.4 经验曲线\n\n| 等级 | 升至下一级所需经验 | 累计 |\n| --- | --- | --- |\n| 1→2 | 10 | 10 |\n| 2→3 | 14 | 24 |\n| 3→4 | 19 | 43 |\n| 4→5 | 25 | 68 |\n| 5→6 | 32 | 100 |\n| 6→7 | 40 | 140 |\n| 7→8 | 49 | 189 |\n| 8→9 | 59 | 248 |\n| 9→10 | 70 | 318 |\n\n1 章 5 节点（2 普战+1 精英+1 首领）约得 10+10+20+40=80 经验 → 打完首领约 3 级。\n\n### 12.5 战斗奖励\n\n| 节点 | 金币 | 经验 | 卡奖励 |\n| --- | --- | --- | --- |\n| 战斗 | 8-15 | 10 | 普通卡池 3 选 1 |\n| 精英 | 15-25 | 20 | 普通+稀有 3 选 1 |\n| 首领 | 30-45 | 40 | 稀有卡池 3 选 1 + 1 属性点 |\n\n### 12.6 商店定价\n\n| 项目 | 价格 |\n| --- | --- |\n| 买卡 | 15（普通）/ 25（稀有） |\n| 删卡 | 20，每删 1 张 +5 递增 |\n| 回血 | 5 金币 / 5 HP |\n| 升级卡 | 15，卡面数值 +2 |\n\n1 章金币收入约 60-100，够 2-3 次消费（买 1-2 卡 + 删 1 卡），符合肉鸽\"选择有限\"的构筑压力。\n\n### 12.7 平衡设计原则\n\n- 费用 ÷5 + 累计上限 3：把抽牌随机性限制在\"节奏差异\"而非\"运气碾压\"\n- 每回合出 3 张上限：防止手牌爆发一回合秒杀，保证 AI 有反应空间\n- 30 回合平局判负：压缩龟缩玩法，节奏正向\n- 精英/首领的\"开局防御\"与\"狂暴\"：制造回合压力点，逼玩家构筑进攻与防御的平衡\nEOF\necho \"appended\"; tail -5 docs/solo-roguelike-design.md"]
