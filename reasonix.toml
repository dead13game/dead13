# 亡命十三街 权限规则
# deny 规则为硬阻断：任何模式（含 yolo）都不可绕过（官方注释: "hard-blocked in every mode"）
[permissions]
deny = [
  "Bash(git push*)",   # GitHub 上传：git push（禁自己 push，改完提醒用户手动 push）
  "Bash(gh *)",        # GitHub CLI：PR / release / repo 上传等，会导致 GitHub 账号封禁
  "Bash(git clone*)",  # 批量拉代码：克隆远程仓库
  "Bash(git pull*)",   # 批量拉代码：拉取远程更新
]
allow = ["Bash=cat public/sfx/README.md; echo \"===playBgm / mute in project===\"; grep -rn \"playBgm\\|stopBgm\\|setMuted\\|SoundManager\\.\" src/ --include=\"*.vue\" --include=\"*.js\" | grep -v \"SoundManager.js\" | head; echo \"===ffmpeg?===\"; which ffmpeg ffplay 2>&1; echo \"===ffmpeg ver===\"; ffmpeg -version 2>&1 | head -1", "Bash=cat >> docs/solo-roguelike-design.md << 'EOF'\n\n---\n\n## 12. 数值总表（设计层草案，试玩后调）\n\n### 12.1 玩家基准\n\n| 项 | 值 |\n| --- | --- |\n| 初始属性 | 力量 2 / 法力 2 / 防御 2 |\n| 初始最大 HP | 20 + 防御 × 2 = 24 |\n| 升级 | 每级 +2 属性点，自由分配 |\n| 费用换算 | `max(1, ⌊2 张扑克点数总和 ÷ 5⌋)`，范围 1-5 |\n| 累计池上限 | 3 点 |\n| 手牌上限 | 6 张 |\n| 每回合出牌上限 | 3 张 |\n| 平局规则 | 30 回合，HP 比例高者胜，相同则玩家败 |\n\n### 12.2 技能卡总表\n\n**物理（力量修正）**\n\n| 卡名 | 费用 | 效果 |\n| --- | --- | --- |\n| 猛击 | 1 | 3 + 力量 伤害 |\n| 重击 | 2 | 6 + 力量 伤害 |\n| 连击 | 3 | 3 + 力量 伤害 × 2 段 |\n| 破甲 | 2 | 4 + 力量 伤害，目标下回合防御 -2 |\n\n**法术（法力修正）**\n\n| 卡名 | 费用 | 效果 |\n| --- | --- | --- |\n| 奥术冲击 | 1 | 2 + 法力 伤害 |\n| 冰锥 | 2 | 3 + 法力 伤害，目标下回合费用 -1 |\n| 治愈 | 2 | 4 + 法力 回血 |\n| 火球 | 3 | 5 + 法力 伤害 |\n\n**防御（防御修正）**\n\n| 卡名 | 费用 | 效果 |\n| --- | --- | --- |\n| 格挡 | 1 | 4 + 防御 减伤（持续到玩家下回合结束） |\n| 回气 | 1 | 2 + 防御 减伤，回复 1 费用 |\n| 铁壁 | 2 | 7 + 防御 减伤 |\n\n**功能**\n\n| 卡名 | 费用 | 效果 |\n| --- | --- | --- |\n| 狂怒 | 1 | 斗志 +2（玛薇卡联动） |\n| 专注 | 1 | 下回合抽 3 张扑克（多 1 费） |\n\n**玛薇卡初始卡组（4 张）**：猛击 ×2、重击 ×1、格挡 ×1\n\n### 12.3 敌人数据\n\n| 敌人 | HP | 攻击卡 | 行为要点 |\n| --- | --- | --- | --- |\n| 普通 | 20 | 2-3 张 3-4 伤 | 够费出最高攻击；HP<30% 优先防御 |\n| 精英 | 30 | 3-4 张 4-5 伤 | 开局铺 1 防御；HP<50% 攻防轮换 |\n| 首领 | 40 | 4 张 5-6 伤 | 每 3 回合狂暴 +2；HP<30% 二阶段攻击频率↑ |\n\n敌人与玩家同费用规则（抽 2 张扑克 ÷5）。\n\n### 12.4 经验曲线\n\n| 等级 | 升至下一级所需经验 | 累计 |\n| --- | --- | --- |\n| 1→2 | 10 | 10 |\n| 2→3 | 14 | 24 |\n| 3→4 | 19 | 43 |\n| 4→5 | 25 | 68 |\n| 5→6 | 32 | 100 |\n| 6→7 | 40 | 140 |\n| 7→8 | 49 | 189 |\n| 8→9 | 59 | 248 |\n| 9→10 | 70 | 318 |\n\n1 章 5 节点（2 普战+1 精英+1 首领）约得 10+10+20+40=80 经验 → 打完首领约 3 级。\n\n### 12.5 战斗奖励\n\n| 节点 | 金币 | 经验 | 卡奖励 |\n| --- | --- | --- | --- |\n| 战斗 | 8-15 | 10 | 普通卡池 3 选 1 |\n| 精英 | 15-25 | 20 | 普通+稀有 3 选 1 |\n| 首领 | 30-45 | 40 | 稀有卡池 3 选 1 + 1 属性点 |\n\n### 12.6 商店定价\n\n| 项目 | 价格 |\n| --- | --- |\n| 买卡 | 15（普通）/ 25（稀有） |\n| 删卡 | 20，每删 1 张 +5 递增 |\n| 回血 | 5 金币 / 5 HP |\n| 升级卡 | 15，卡面数值 +2 |\n\n1 章金币收入约 60-100，够 2-3 次消费（买 1-2 卡 + 删 1 卡），符合肉鸽\"选择有限\"的构筑压力。\n\n### 12.7 平衡设计原则\n\n- 费用 ÷5 + 累计上限 3：把抽牌随机性限制在\"节奏差异\"而非\"运气碾压\"\n- 每回合出 3 张上限：防止手牌爆发一回合秒杀，保证 AI 有反应空间\n- 30 回合平局判负：压缩龟缩玩法，节奏正向\n- 精英/首领的\"开局防御\"与\"狂暴\"：制造回合压力点，逼玩家构筑进攻与防御的平衡\nEOF\necho \"appended\"; tail -5 docs/solo-roguelike-design.md", "Bash=cat reasonix.toml; echo \"===env===\"; env | grep -iE \"deepseek|api_key|reasonix\" | sed 's/=.*/=***/' ; echo \"===home config===\"; cat ~/.reasonix/config.toml 2>/dev/null | head -20 || echo \"(无 home config)\"", "Bash=cd \"C:\\Users\\drtion\\Desktop\\myracler's files\\亡命十三街\\update_log\\模拟宇宙\" && ls -la && wc -l *.txt && diff <(cat 模拟宇宙.txt) <(cat 模拟宇宙\\(1\\).txt) | head -100", "Bash=cd \"C:\\Users\\drtion\\Desktop\\myracler's files\\亡命十三街\" && cat >> src/simuniverse/logic/uni.test.js << 'EOF'\n\ndescribe(\"模拟宇宙 M2：战斗开始与波次\", () => {\n  it(\"battle 战斗：3 波×3 普通，HP = 10 × 位面倍数\", () => {\n    const s = createUniState();\n    startCombat(s);\n    const c = s.combat;\n    expect(c.kind).toBe(\"battle\");\n    expect(c.waves).toEqual(BATTLE_WAVES);\n    expect(c.enemies).toHaveLength(3);\n    c.enemies.forEach((e) => {\n      expect(e.kind).toBe(\"normal\");\n      expect(e.hp).toBe(10); // 位面 1：10 × 1\n      expect(e.maxHp).toBe(10);\n    });\n    expect(c.phase).toBe(\"player-action\");\n    expect(c.pendingPoker).toHaveLength(2);\n  });\n\n  it(\"位面 2：敌人 HP 翻倍（20）\", () => {\n    const s = createUniState();\n    s.plane = 2;\n    s.region = { type: \"battle\", waves: BATTLE_WAVES };\n    startCombat(s);\n    expect(s.combat.enemies[0].hp).toBe(20);\n  });\n\n  it(\"波次推进：全灭当前波 → 下一波生成\", () => {\n    const s = createUniState();\n    startCombat(s);\n    // 手动清空第一波\n    s.combat.enemies.forEach((e) => {\n      e.hp = 0;\n      e.alive = false;\n    });\n    nextWave(s);\n    expect(s.combat.wave).toBe(1);\n    expect(s.combat.enemies).toHaveLength(3);\n    expect(s.combat.enemies.every((e) => e.alive)).toBe(true);\n  });\n\n  it(\"最后一波全灭 → 胜利\", () => {\n    const s = createUniState();\n    startCombat(s);\n    s.combat.wave = 2;\n    s.combat.enemies.forEach((e) => {\n      e.hp = 0;\n      e.alive = false;\n    });\n    nextWave(s);\n    expect(s.combat.phase).toBe(\"won\");\n    expect(s.combat.lastReward.shards).toBe(REGION_REWARD.battle.shards);\n    expect(s.shards).toBe(30);\n  });\n});\n\ndescribe(\"模拟宇宙 M2：玩家行动\", () => {\n  it(\"普攻：伤害 = 两牌面值之和 - 2\", () => {\n    const s = createUniState();\n    startCombat(s);\n    setPoker(s, 5, 7);\n    const before = s.combat.enemies[0].hp;\n    const r = playerAttack(s, 0);\n    expect(r.ok).toBe(true);\n    expect(r.dmg).toBe(10); // 5+7-2\n    expect(s.combat.enemies[0].hp).toBe(before - 10);\n  });\n\n  it(\"普攻打死敌人后推进到下一名角色\", () => {\n    const s = createUniState();\n    startCombat(s);\n    const first = s.combat.activeIdx;\n    setPoker(s, 9, 9); // 16 伤害 > 10 HP\n    playerAttack(s, 0);\n    expect(s.combat.enemies[0].alive).toBe(false);\n    expect(s.combat.activeIdx).not.toBe(first); // 下一名角色行动\n  });\n\n  it(\"防御：2 张牌进入防御堆\", () => {\n    const s = createUniState();\n    startCombat(s);\n    const idx = s.combat.activeIdx;\n    const before = s.team[idx].status.defensePile.length;\n    playerDefense(s);\n    expect(s.team[idx].status.defensePile.length).toBe(before + 2);\n  });\n\n  it(\"防御牌抵扣伤害\", () => {\n    const s = createUniState();\n    startCombat(s);\n    // 给成员塞 2 张防御牌（值 5+5）\n    s.team[0].status.defensePile = [\n      { value: 5, rank: \"5\", suit: \"♠\" },\n      { value: 5, rank: \"5\", suit: \"♦\" },\n    ];\n    const hpBefore = s.team[0].hp;\n    // 用普通 A（单体 5）打成员 0：完全被 5 点防御牌挡住\n    s.combat.enemies = [\n      { id: 0, kind: \"normal\", name: \"普通敌人1\", pattern: \"A\", hp: 10, maxHp: 10, shield: 0, locked: [], round: 1, alive: true },\n    ];\n    s.combat.enemyQueue = [{ enemyIdx: 0, action: { type: \"single\", dmg: 5 }, desc: \"重击#1\" }];\n    s.combat.phase = \"enemy-announce\";\n    enemyAnnounce(s);\n    enemyResolve(s);\n    expect(s.team[0].hp).toBe(hpBefore); // 防御全挡\n    expect(s.team[0].status.defensePile).toHaveLength(1); // 剩 1 张（5 点被打掉）\n  });\n});\n\ndescribe(\"模拟宇宙 M2：敌人模板\", () => {\n  it(\"普通 A：随机 1 人单体伤害（含膨胀）\", () => {\n    const s = createUniState();\n    startCombat(s);\n    const before = s.team.map((t) => t.hp);\n    // 清空防御堆确保扣血\n    s.team.forEach((t) => (t.status.defensePile = []));\n    s.combat.enemies = [\n      { id: 0, kind: \"normal\", name: \"普通敌人1\", pattern: \"A\", hp: 10, maxHp: 10, shield: 0, locked: [], round: 1, alive: true },\n    ];\n    s.combat.enemyQueue = [{ enemyIdx: 0, action: { type: \"single\", dmg: 5 }, desc: \"重击#1\" }];\n    s.combat.phase = \"enemy-announce\";\n    enemyAnnounce(s);\n    enemyResolve(s);\n    const hpSum = s.team.reduce((a, t) => a + t.hp, 0);\n    expect(hpSum).toBe(before.reduce((a, b) => a + b) - 5); // 恰好 1 人掉 5\n  });\n\n  it(\"普通 B：全体 3 点\", () => {\n    const s = createUniState();\n    startCombat(s);\n    s.team.forEach((t) => (t.status.defensePile = []));\n    const before = s.team.map((t) => t.hp);\n    s.combat.enemies = [\n      { id: 0, kind: \"normal\", name: \"普通敌人1\", pattern: \"B\", hp: 10, maxHp: 10, shield: 0, locked: [], round: 1, alive: true },\n    ];\n    s.combat.enemyQueue = [{ enemyIdx: 0, action: { type: \"aoe\", dmg: 3 }, desc: \"震荡波#1\" }];\n    s.combat.phase = \"enemy-announce\";\n    enemyAnnounce(s);\n    enemyResolve(s);\n    s.team.forEach((t, i) => expect(t.hp).toBe(before[i] - 3));\n  });\n\n  it(\"普通 C：自身获得 30% 生命上限护盾\", () => {\n    const s = createUniState();\n    startCombat(s);\n    s.combat.enemies = [\n      { id: 0, kind: \"normal\", name: \"普通敌人1\", pattern: \"C\", hp: 10, maxHp: 10, shield: 0, locked: [], round: 1, alive: true },\n    ];\n    s.combat.enemyQueue = [{ enemyIdx: 0, action: { type: \"shield\", pct: 0.3 }, desc: \"岩化#1\" }];\n    s.combat.phase = \"enemy-announce\";\n    enemyAnnounce(s);\n    enemyResolve(s);\n    expect(s.combat.enemies[0].shield).toBe(3); // 10 × 30%\n  });\n\n  it(\"精英 B：锁定 → 下回合对被锁定者 16 点 ×2\", () => {\n    const s = createUniState();\n    startCombat(s);\n    s.team.forEach((t) => (t.status.defensePile = []));\n    s.combat.enemies = [\n      { id: 0, kind: \"elite\", name: \"精英敌人1\", pattern: \"B\", hp: 25, maxHp: 25, shield: 0, locked: [], round: 1, alive: true },\n    ];\n    // 第 1 回合：锁定\n    s.combat.enemyQueue = [\n      { enemyIdx: 0, action: { type: \"lock\" }, desc: \"锁定#1\" },\n      { enemyIdx: 0, action: { type: \"lock\" }, desc: \"锁定#2\" },\n    ];\n    s.combat.phase = \"enemy-announce\";\n    enemyAnnounce(s);\n    enemyResolve(s);\n    enemyAnnounce(s);\n    enemyResolve(s);\n    expect(s.combat.enemies[0].locked.length).toBeGreaterThan(0);\n    // 第 2 回合：对被锁定者 16×2（位面 1 无膨胀）\n    const locked = s.combat.enemies[0].locked[0];\n    const before = s.team[locked].hp;\n    s.combat.enemyQueue = [\n      { enemyIdx: 0, action: { type: \"hitLocked\", dmg: 16 }, desc: \"狙击#1\" },\n      { enemyIdx: 0, action: { type: \"hitLocked\", dmg: 16 }, desc: \"狙击#2\" },\n    ];\n    s.combat.phase = \"enemy-announce\";\n    enemyAnnounce(s);\n    enemyResolve(s);\n    enemyAnnounce(s);\n    enemyResolve(s);\n    expect(s.team[locked].hp).toBe(Math.max(0, before - 32));\n  });\n\n  it(\"精英 C：debuff 上 dot，随后回合按 dot 扣血\", () => {\n    const s = createUniState();\n    startCombat(s);\n    s.combat.enemies = [\n      { id: 0, kind: \"elite\", name: \"精英敌人1\", pattern: \"C\", hp: 25, maxHp: 25, shield: 0, locked: [], round: 1, alive: true },\n    ];\n    s.combat.enemyQueue = [{ enemyIdx: 0, action: { type: \"debuff\" }, desc: \"腐蚀#1\" }];\n    s.combat.phase = \"enemy-announce\";\n    enemyAnnounce(s);\n    enemyResolve(s);\n    const dotTarget = s.team.find((t) => t.status.dot > 0);\n    expect(dotTarget).toBeTruthy();\n    // 新回合 dot 结算\n    const before = dotTarget.hp;\n    s.combat.phase = \"player-action\";\n    s.combat.enemyQueue = [];\n    s.combat.turnIdx = 3; // 假装回合结束触发下一回合\n    nextPlayerTurnForTest(s);\n    expect(dotTarget.hp).toBe(Math.max(0, before - 2));\n  });\n});\n\n/** 测试辅助：推进到下一回合（dot 结算在 startPlayerTurn） */\nfunction nextPlayerTurnForTest(s) {\n  // 直接调用 startPlayerTurn 需要导出；这里模拟回合切换\n  const { startPlayerTurn } = require(\"./uniCombat.js\");\n  startPlayerTurn(s);\n}\n\ndescribe(\"模拟宇宙 M2：首领穿插\", () => {\n  it(\"首领：前 2 名玩家行动后穿插 1 次，剩余 2 名后行动 2 次\", () => {\n    const s = createUniState();\n    s.region = { type: \"boss\", name: \"首领\", waves: [{ kind: \"boss\", count: 1 }] };\n    startCombat(s);\n    // 强制首领 pattern 为 A（便于断言）\n    s.combat.enemies[0].pattern = \"A\";\n    // 前 2 名玩家行动（防御）\n    playerDefense(s);\n    playerDefense(s);\n    expect(s.combat.turnCount).toBe(2);\n    expect(s.combat.phase).toBe(\"enemy-announce\");\n    expect(s.combat.enemyQueue).toHaveLength(1); // interlude（aoe 8）\n    // 结算穿插\n    enemyAnnounce(s);\n    enemyResolve(s);\n    // 剩余 2 名玩家行动\n    playerDefense(s);\n    playerDefense(s);\n    expect(s.combat.phase).toBe(\"enemy-announce\");\n    expect(s.combat.enemyQueue).toHaveLength(2); // 行动1（single 12）+ 行动2（heal）\n  });\n\n  it(\"首领 B：穿插减疗，行动眩晕\", () => {\n    const s = createUniState();\n    s.region = { type: \"boss\", name: \"首领\", waves: [{ kind: \"boss\", count: 1 }] };\n    startCombat(s);\n    s.combat.enemies[0].pattern = \"B\";\n    playerDefense(s);\n    playerDefense(s);\n    enemyAnnounce(s);\n    enemyResolve(s);\n    // 减疗 50%\n    expect(s.team.every((t) => t.status.healCut === 0.5)).toBe(true);\n    // 剩余 2 名行动后：全体 6 + 眩晕 1 人\n    playerDefense(s);\n    playerDefense(s);\n    expect(s.combat.enemyQueue).toHaveLength(2);\n    enemyAnnounce(s);\n    enemyResolve(s);\n    enemyAnnounce(s);\n    enemyResolve(s);\n    expect(s.team.some((t) => t.status.stunned)).toBe(true);\n  });\n});\n\ndescribe(\"模拟宇宙 M2：转化及格线\", () => {\n  it(\"转化波次：5 普通 + 5 普通 + 3 精英\", () => {\n    const s = createUniState();\n    s.region = { type: \"transform\", name: \"转化\", waves: TRANSFORM_WAVES };\n    startCombat(s);\n    expect(s.combat.enemies).toHaveLength(5);\n    s.combat.enemies.forEach((e) => expect(e.kind).toBe(\"normal\"));\n  });\n\n  it(\"20 回合未灭两波 → 战斗失败\", () => {\n    const s = createUniState();\n    s.region = { type: \"transform\", name: \"转化\", waves: TRANSFORM_WAVES };\n    startCombat(s);\n    s.combat.wave = 0;\n    s.combat.round = 20;\n    // 触发回合结束判定（finishEnemyTurn）\n    s.combat.phase = \"enemy-announce\";\n    s.combat.enemyQueue = [];\n    enemyAnnounce(s); // 队列空 → finishEnemyTurn → 及格线判定\n    expect(s.combat.phase).toBe(\"lost\");\n    expect(s.gameOver).toBe(true);\n  });\n\n  it(\"打完两波 → wave-clear：撤退胜利 / 挑战第三波\", () => {\n    const s = createUniState();\n    s.region = { type: \"transform\", name: \"转化\", waves: TRANSFORM_WAVES };\n    startCombat(s);\n    // 模拟第二波清空（wave=1）\n    s.combat.wave = 1;\n    s.combat.enemies = [];\n    s.combat.turnCount = 2;\n    // 触发 finishPlayerAction 的波次检查：让一名玩家防御\n    playerDefense(s);\n    expect(s.combat.phase).toBe(\"wave-clear\");\n    // 撤退\n    const r = chooseThirdWave(s, false);\n    expect(r.ok).toBe(true);\n    expect(s.combat.phase).toBe(\"won\");\n  });\n\n  it(\"挑战第三波：3 精英，击杀 +150/个\", () => {\n    const s = createUniState();\n    s.region = { type: \"transform\", name: \"转化\", waves: TRANSFORM_WAVES };\n    startCombat(s);\n    s.combat.wave = 1;\n    s.combat.enemies = [];\n    s.combat.turnCount = 1;\n    playerDefense(s);\n    expect(s.combat.phase).toBe(\"wave-clear\");\n    chooseThirdWave(s, true);\n    expect(s.combat.wave).toBe(2);\n    expect(s.combat.enemies).toHaveLength(3);\n    s.combat.enemies.forEach((e) => expect(e.kind).toBe(\"elite\"));\n    // 击杀 1 个精英 +150\n    const shardsBefore = s.shards;\n    s.combat.enemies[0].hp = 1;\n    const victim = s.combat.enemies[0];\n    const { playerAttack: pa } = { playerAttack };\n    s.combat.activeIdx = 0;\n    s.combat.pendingPoker = [{ value: 13, rank: \"K\", suit: \"♠\" }, { value: 13, rank: \"K\", suit: \"♣\" }];\n    pa(s, victim.id);\n    expect(s.shards).toBe(shardsBefore + 150);\n  });\n});\n\ndescribe(\"模拟宇宙 M2：战斗结束\", () => {\n  it(\"全灭 → gameOver\", () => {\n    const s = createUniState();\n    startCombat(s);\n    s.team.forEach((t) => {\n      t.hp = 0;\n      t.alive = false;\n    });\n    // 敌人打一下触发全灭判定\n    s.combat.enemyQueue = [{ enemyIdx: 0, action: { type: \"aoe\", dmg: 3 }, desc: \"x\" }];\n    s.combat.phase = \"enemy-announce\";\n    enemyAnnounce(s);\n    enemyResolve(s);\n    expect(s.combat.phase).toBe(\"lost\");\n    expect(s.gameOver).toBe(true);\n  });\n});\nEOF\necho \"appended\"", "Bash=cd \"C:\\Users\\drtion\\Desktop\\myracler's files\\亡命十三街\" && cat >> src/simuniverse/logic/uni.test.js << 'UNIEOF'\n\ndescribe(\"模拟宇宙 M3：角色技能\", () => {\n  it(\"温迪：爆发 N 张牌（等级 1 = 2 张），伤害 = 牌面和 - 2\", () => {\n    const s = createUniState([1, 2, 3, 4]);\n    startCombat(s);\n    s.team[0].skillLevel = 1;\n    // 控制抽牌：清空牌堆让 drawPoker 重建？直接注入低概率不可控 → 用 canUse + 手动牌堆\n    // 简化：直接验证 executeUniSkill 的牌数逻辑（把牌堆塞满小牌）\n    s.combat.pokerDeck = [\n      { value: 3, rank: \"3\", suit: \"♠\" },\n      { value: 4, rank: \"4\", suit: \"♦\" },\n      { value: 2, rank: \"2\", suit: \"♣\" },\n      { value: 5, rank: \"5\", suit: \"♥\" },\n      { value: 1, rank: \"A\", suit: \"♠\" },\n      { value: 1, rank: \"A\", suit: \"♦\" },\n      { value: 1, rank: \"A\", suit: \"♣\" },\n      { value: 1, rank: \"A\", suit: \"♥\" },\n    ];\n    const enemy = s.combat.enemies[0];\n    const hpBefore = enemy.hp;\n    const r = executeUniSkill(s, 0, { targetIdx: enemy.id });\n    expect(r.ok).toBe(true);\n    // 等级 1 → 2 张牌：3+4=7，-2 → 5\n    expect(enemy.hp).toBe(hpBefore - 5);\n    expect(s.team[0].skillCooldown).toBe(7);\n  });\n\n  it(\"钟离：全队护盾（等级 1 = 18）\", () => {\n    const s = createUniState([2, 3, 4, 5]);\n    startCombat(s);\n    const r = executeUniSkill(s, 0, {});\n    expect(r.ok).toBe(true);\n    s.team.forEach((t) => expect(t.shield).toBe(18));\n  });\n\n  it(\"雷电将军：单体伤害（等级 1 = 20）\", () => {\n    const s = createUniState([3, 2, 4, 5]);\n    startCombat(s);\n    const enemy = s.combat.enemies[0];\n    const hpBefore = enemy.hp;\n    const r = executeUniSkill(s, 0, { targetIdx: enemy.id });\n    expect(r.ok).toBe(true);\n    expect(enemy.hp).toBe(hpBefore - 20);\n  });\n\n  it(\"纳西妲：指定角色立即行动（插队）\", () => {\n    const s = createUniState([4, 1, 2, 3]);\n    startCombat(s);\n    // 当前行动者 index 0（纳西妲），指定 2 号成员立即行动\n    const orderBefore = [...s.combat.actionOrder];\n    const r = executeUniSkill(s, 0, { members: [2] });\n    expect(r.ok).toBe(true);\n    expect(s.combat.actionOrder[s.combat.turnIdx + 1]).toBe(2);\n    expect(orderBefore).toContain(2);\n  });\n\n  it(\"芙宁娜：全队增伤 20% + 治疗（等级 1）\", () => {\n    const s = createUniState([5, 1, 2, 3]);\n    startCombat(s);\n    s.team[0].hp = 1; // 芙宁娜自己残血\n    const r = executeUniSkill(s, 0, {});\n    expect(r.ok).toBe(true);\n    s.team.forEach((t) => {\n      expect(t.status.dmgBuffPct).toBe(20);\n      expect(t.status.dmgBuffTurns).toBe(3);\n    });\n    expect(s.team[0].hp).toBeGreaterThan(1); // 治疗生效\n    // 普攻伤害吃增伤\n    const enemy = s.combat.enemies[0];\n    const hpBefore = enemy.hp;\n    // 推进到下一名角色（成员 1）普攻\n    setPoker(s, 10, 10); // raw = 18\n    playerAttack(s, enemy.id);\n    expect(enemy.hp).toBe(hpBefore - Math.floor(18 * 1.2));\n  });\n\n  it(\"被动同步：玛薇卡斗志上限 + 少女攻防加成\", () => {\n    const s = createUniState([6, 7, 1, 2]);\n    syncPassives(s);\n    // 玛薇卡（0）斗志上限 4（1 级），受益 1 人 = 自己\n    expect(s.team[0].status.spiritCap).toBe(4);\n    expect(s.team[1].status.spiritCap).toBe(0);\n    // 少女（1）攻防 +2（1 级），受益 1 人 = 自己\n    expect(s.team[1].status.atkBonus).toBe(2);\n    expect(s.team[0].status.atkBonus).toBe(0);\n    // 升级到 8 级：受益 2 人\n    s.team[0].skillLevel = 8;\n    s.team[1].skillLevel = 8;\n    syncPassives(s);\n    expect(s.team[0].status.spiritCap).toBe(10);\n    expect(s.team[1].status.spiritCap).toBe(10);\n    expect(s.team[2].status.spiritCap).toBe(0);\n    expect(s.team[0].status.atkBonus).toBe(8);\n    expect(s.team[1].status.atkBonus).toBe(8);\n  });\n\n  it(\"普攻吃被动修正：少女攻加成 + 玛薇卡斗志\", () => {\n    const s = createUniState([6, 7, 1, 2]);\n    syncPassives(s);\n    startCombat(s);\n    // 少女（成员 1）是当前行动者时测普攻\n    // 直接构造：让成员 1 成为 activeIdx\n    s.combat.activeIdx = 1;\n    s.combat.turnIdx = 0;\n    s.team[1].status.spiritCap = 0;\n    setPoker(s, 5, 5); // raw = 8\n    const enemy = s.combat.enemies[0];\n    const hpBefore = enemy.hp;\n    playerAttack(s, enemy.id);\n    expect(enemy.hp).toBe(hpBefore - 10); // 8 + 2（少女攻）\n  });\n\n  it(\"莉奈娅：一技能全队盾 / 二技能 dot\", () => {\n    const s = createUniState([9, 1, 2, 3]);\n    startCombat(s);\n    // 盾（等级 1 → 1 张 = 6 点）\n    const r1 = executeUniSkill(s, 0, { branch: \"shield\" });\n    expect(r1.ok).toBe(true);\n    s.team.forEach((t) => expect(t.shield).toBe(6));\n    // 二技能 dot（等级 1 → 立即 3 点全体）\n    s.team[0].skillCooldown = 0; // 重置冷却\n    const enemiesBefore = s.combat.enemies.map((e) => e.hp);\n    const r2 = executeUniSkill(s, 0, { branch: \"dot\" });\n    expect(r2.ok).toBe(true);\n    s.combat.enemies.forEach((e, i) => expect(e.hp).toBe(enemiesBefore[i] - 3));\n    // 6 级 → 持续 dot 3 回合\n    s.team[0].skillCooldown = 0;\n    s.team[0].skillLevel = 6;\n    const r3 = executeUniSkill(s, 0, { branch: \"dot\" });\n    expect(r3.ok).toBe(true);\n    s.combat.enemies.forEach((e) => {\n      expect(e.dotDmg).toBe(7);\n      expect(e.dotTurns).toBe(3);\n    });\n  });\n\n  it(\"爱蜜莉雅：敌方停 1 回合（等级 1）\", () => {\n    const s = createUniState([10, 1, 2, 3]);\n    startCombat(s);\n    const r = executeUniSkill(s, 0, {});\n    expect(r.ok).toBe(true);\n    s.combat.enemies.forEach((e) => expect(e.stunnedTurns).toBe(1));\n    expect(s.team[0].skillCooldown).toBe(12);\n  });\n\n  it(\"风堇：全队生命上限 +10% 回满 + 回复量 10% 伤害\", () => {\n    const s = createUniState([8, 1, 2, 3]);\n    startCombat(s);\n    s.team[0].hp = 1; // 风堇残血\n    const enemy = s.combat.enemies[0];\n    const enemyHpBefore = enemy.hp;\n    const r = executeUniSkill(s, 0, {});\n    expect(r.ok).toBe(true);\n    s.team.forEach((t) => {\n      expect(t.maxHp).toBe(Math.floor(t.status.origMaxHp * 1.1));\n      expect(t.hp).toBe(t.maxHp); // 回满\n    });\n    expect(enemy.hp).toBeLessThan(enemyHpBefore); // 附加伤害\n    // 3 回合后还原\n    s.combat.round = 2;\n    startPlayerTurn(s);\n    startPlayerTurn(s);\n    startPlayerTurn(s);\n    s.team.forEach((t) => {\n      expect(t.maxHp).toBe(t.status.origMaxHp);\n    });\n  });\n\n  it(\"冷却递减：开大后每回合 -1（含开大当回合）\", () => {\n    const s = createUniState([1, 2, 3, 4]);\n    startCombat(s);\n    const r = executeUniSkill(s, 0, { targetIdx: s.combat.enemies[0].id });\n    expect(r.ok).toBe(true);\n    expect(s.team[0].skillCooldown).toBe(7); // 开大当回合\n    startPlayerTurn(s);\n    expect(s.team[0].skillCooldown).toBe(6); // 下回合 -1\n  });\n\n  it(\"canUseUniSkill：冷却中 / 被动不可用\", () => {\n    const s = createUniState([1, 2, 3, 4]);\n    startCombat(s);\n    expect(canUseUniSkill(s, 0).ok).toBe(true);\n    executeUniSkill(s, 0, { targetIdx: s.combat.enemies[0].id });\n    expect(canUseUniSkill(s, 0).ok).toBe(false); // 冷却中\n    // 玛薇卡被动\n    const s2 = createUniState([6, 1, 2, 3]);\n    startCombat(s2);\n    expect(canUseUniSkill(s2, 0).ok).toBe(false); // 被动\n  });\n});\n\ndescribe(\"模拟宇宙 M3：菜月昴死亡回归\", () => {\n  it(\"全灭 → 回滚本层开始前，消耗 1 次读档\", () => {\n    const s = createUniState([11, 2, 3, 4]);\n    addShards(s, 50);\n    recordSavepoint(s);\n    startCombat(s);\n    // 全灭\n    s.team.forEach((t) => {\n      t.hp = 0;\n      t.alive = false;\n    });\n    s.combat.enemyQueue = [{ enemyIdx: 0, action: { type: \"aoe\", dmg: 3 }, desc: \"x\" }];\n    s.combat.phase = \"enemy-announce\";\n    enemyAnnounce(s);\n    enemyResolve(s);\n    expect(s.gameOver).toBe(false); // 读档保命\n    expect(s.caiyueangLoads).toBe(1);\n    expect(s.combat).toBeNull(); // 回到层开始前\n    expect(s.shards).toBe(50); // 状态回滚\n    expect(s.team.every((t) => t.alive)).toBe(true); // 队伍复活\n  });\n\n  it(\"读档 3 次用尽后全灭 → 终局\", () => {\n    const s = createUniState([11, 2, 3, 4]);\n    s.caiyueangLoads = 3;\n    startCombat(s);\n    s.team.forEach((t) => {\n      t.hp = 0;\n      t.alive = false;\n    });\n    s.combat.enemyQueue = [{ enemyIdx: 0, action: { type: \"aoe\", dmg: 3 }, desc: \"x\" }];\n    s.combat.phase = \"enemy-announce\";\n    enemyAnnounce(s);\n    enemyResolve(s);\n    expect(s.gameOver).toBe(true);\n    expect(s.caiyueangLoads).toBe(3);\n  });\n\n  it(\"队伍无菜月昴 → 全灭直接终局\", () => {\n    const s = createUniState([1, 2, 3, 4]);\n    startCombat(s);\n    s.team.forEach((t) => {\n      t.hp = 0;\n      t.alive = false;\n    });\n    s.combat.enemyQueue = [{ enemyIdx: 0, action: { type: \"aoe\", dmg: 3 }, desc: \"x\" }];\n    s.combat.phase = \"enemy-announce\";\n    enemyAnnounce(s);\n    enemyResolve(s);\n    expect(s.gameOver).toBe(true);\n  });\n});\nUNIEOF\necho done", "Bash=cd \"C:\\Users\\drtion\\Desktop\\myracler's files\\亡命十三街\" && sed -n '31,60p' src/game/deck.js && cat > /tmp/uni-debug.test.js << 'EOF'\nimport { describe, it, expect } from \"vitest\";\nimport { createUniState } from \"./uniState.js\";\nimport { startCombat } from \"./uniCombat.js\";\nimport { executeUniSkill } from \"./uniSkills.js\";\n\ndescribe(\"debug\", () => {\n  it(\"钟离 r 详情\", () => {\n    const s = createUniState([2, 3, 4, 5]);\n    startCombat(s);\n    console.log(\"activeIdx:\", s.combat.activeIdx, \"phase:\", s.combat.phase, \"pendingPoker:\", s.combat.pendingPoker.length);\n    const r = executeUniSkill(s, 0, {});\n    console.log(\"result:\", JSON.stringify(r));\n    expect(true).toBe(true);\n  });\n});\nEOF\ncp /tmp/uni-debug.test.js src/simuniverse/logic/uni-debug.test.js && npx vitest run src/simuniverse/logic/uni-debug.test.js 2>&1 | grep -A3 \"activeIdx\\|result\" | head -10; rm src/simuniverse/logic/uni-